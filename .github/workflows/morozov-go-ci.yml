name: Morozov Go CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - "morozov-variant-13/**"
      - ".github/workflows/morozov-go-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "morozov-variant-13/**"
      - ".github/workflows/morozov-go-ci.yml"

defaults:
  run:
    working-directory: morozov-variant-13

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Run tests with coverage
        run: go test ./... -cover

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Build binary
        run: mkdir -p ../bin && go build -o ../bin/morozov-variant-13 .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: morozov-go-binary
          path: bin/morozov-variant-13
