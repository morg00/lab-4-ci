name: Ermakov Node.js CI

on:
  push:
    branches:
      - main
    paths:
      - "ermakov-variant-7/**"
      - ".github/workflows/ermakov-node-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ermakov-variant-7/**"
      - ".github/workflows/ermakov-node-ci.yml"

defaults:
  run:
    working-directory: ermakov-variant-7

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ermakov-variant-7/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ermakov-variant-7/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Mocha tests with coverage
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ermakov-variant-7/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build npm package
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ermakov-node-package
          path: ermakov-variant-7/*.tgz
